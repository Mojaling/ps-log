<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>풀이 코드 — PS Log</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/solution.css" />
</head>
<body class="solution-page">
  <main class="solution-shell">
    <header class="solution-topbar">
      <a class="solution-brand" href="/">
        <img src="/assets/ps-log-icon.png" alt="" width="34" height="34" />
        <span><b>PS Log</b><small>풀이 코드</small></span>
      </a>
      <button type="button" class="btn ghost" id="solutionBack">← 목록으로</button>
    </header>

    <section class="solution-card" id="solutionCard" hidden>
      <div class="solution-head">
        <div>
          <p class="eyebrow" id="solutionOwner">풀이</p>
          <h1 id="solutionTitle">문제 풀이</h1>
          <div class="solution-meta" id="solutionMeta"></div>
        </div>
        <div class="solution-actions">
          <span class="solution-language" id="solutionLanguage"></span>
          <button type="button" class="btn" id="solutionCopy">코드 복사</button>
        </div>
      </div>
      <pre class="solution-pre"><code id="solutionCode"></code></pre>
    </section>

    <section class="solution-state" id="solutionState" aria-live="polite">풀이를 불러오는 중…</section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/vendor/prism-core.min.js"></script>
  <script src="/vendor/prism-clike.min.js"></script>
  <script src="/vendor/prism-c.min.js"></script>
  <script src="/vendor/prism-cpp.min.js"></script>
  <script src="/vendor/prism-java.min.js"></script>
  <script src="/vendor/prism-python.min.js"></script>
  <script type="module" src="/solution.js"></script>
</body>
</html>
